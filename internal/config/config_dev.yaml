app:
  name: rockgame
  env: dev
  version: 1.0.0
  region: default
  language: en

server:
  addr: ":8080"
  read_timeout: 30
  write_timeout: 30
  mode: debug

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root123
  db_name: rockgame
  max_open_conns: 50
  max_idle_conns: 10
  max_lifetime: 3600
  shard_count: 16

log_db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root123
  db_name: rockgame_log
  max_open_conns: 10
  max_idle_conns: 5
  max_lifetime: 3600

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 100

etcd:
  addrs:
    - 127.0.0.1:2379
  dial_timeout: 5

log:
  level: debug
  format: console
  output: stdout

jwt:
  secret: "dev-jwt-secret-change-in-production"
  access_ttl: 15
  refresh_ttl: 7
  session_ttl: 5
  issuer: rockgame
