###############################################################################
# Nginx 反向代理 / 负载均衡
###############################################################################
  nginx:
    image: nginx:alpine
    container_name: rockgame-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gate-0
      - gate-1

volumes:
  mysql-data:
  redis-data:
