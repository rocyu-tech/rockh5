      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: rockgame-node-account-1
    restart: always
    command: ["./bin/node-account", "-config", "/app/etc/prod/config.yaml", "-node", "1"]
    ports:
      - "8002:8002"
    depends_on:
