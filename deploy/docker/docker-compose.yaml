# RockGame Multi-Instance Deployment
# Usage: docker-compose -f docker-compose.yaml up -d
#
# 无状态服务: Gate / Account Node / Lobby Node / Game Node / Event Node
#   → 多实例直接扩展，前面挂 LB 轮询
# 有状态 Mesh: Activity / Shop / VIP / Task / Mail / Rank / Agent / Item / Tag / RedDot
#   → 多实例通过一致性哈希路由，etcd Watch 感知节点变化自动更新 Hash 环

version: "3.8"

###############################################################################
# 基础设施
###############################################################################
services:

  mysql:
    image: mysql:8.0
    container_name: rockgame-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: rockgame
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rockgame-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: bitnami/etcd:3.5
    container_name: rockgame-etcd
    restart: always
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

###############################################################################
# 接入层 — Gate (无状态, 2 实例, 前面挂 Nginx/Kong)
# 端口: 8080(实例0), 8081(实例1)
# 说明: Gate 是纯无状态服务，多实例完全等价，LB 随机/轮询分发
###############################################################################
  gate-0:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: rockgame-gate-0
    restart: always
    command: ["./bin/gate", "-config", "/app/etc/prod/config.yaml", "-node", "0", "-nodes", "2"]
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
    environment:
      ROCKGAME_APP_NAME: rockgame-gate

  gate-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: rockgame-gate-1
    restart: always
    command: ["./bin/gate", "-config", "/app/etc/prod/config.yaml", "-node", "1", "-nodes", "2"]
    ports:
      - "8081:8081"
    depends_on:
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
    environment:
      ROCKGAME_APP_NAME: rockgame-gate

###############################################################################
# Node 层 — 无状态服务 (各 2 实例)
# 说明: Account/Lobby/Game/Event 都是处理业务逻辑的无状态 Node，
#       每个实例通过 -node 参数获取不同端口偏移，LB 轮询分发
###############################################################################

  # Account Node: 8001, 8002
  node-account-0:
