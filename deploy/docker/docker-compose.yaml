###############################################################################
# Mesh 层 — 有状态服务 (各 2 实例, 一致性哈希路由)
# 说明: Mesh 服务持有用户会话数据/活动进度等有状态信息，
#       同一用户的请求必须路由到同一实例。
#       通过 etcd 注册中心感知节点上下线，自动更新一致性哈希环。
#       扩容时仅约 1/N 的用户迁移到新节点。
###############################################################################

  # Activity Mesh: 9001, 9002
  mesh-activity-0:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: rockgame-mesh-activity-0
